<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Quiz App</title>
    <style>
        :root { --primary: #4a90e2; --bg: #f4f4f9; }
        body { font-family: sans-serif; background: var(--bg); display: flex; justify-content: center; padding-top: 50px; }
        #quiz-container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h1 { font-size: 1.5rem; color: #333; margin-bottom: 1.5rem; text-align: center; }
        #question { font-size: 1.2rem; margin-bottom: 1rem; font-weight: 600; }
        .btn-grid { display: grid; gap: 10px; }
        .btn { padding: 12px; border: 1px solid var(--primary); background: white; cursor: pointer; border-radius: 4px; transition: 0.2s; }
        .btn:hover { background: var(--primary); color: white; }
    </style>
</head>
<body>

<div id="quiz-container">
    <h1 id="quiz-title">Quiz App</h1>
    <div id="question">Loading question...</div>
    <div id="answer-buttons" class="btn-grid">
        <!-- Buttons will be injected here -->
    </div>
</div>

<script>
    // Minimal logic to render layout
    const questionElement = document.getElementById('question');
    const answerButtonsElement = document.getElementById('answer-buttons');

    const sampleData = {
        question: "Which language is used for web styling?",
        answers: ["HTML", "CSS", "Python", "Java"]
    };

    function showQuestion(data) {
        questionElement.innerText = data.question;
        data.answers.forEach(text => {
            const button = document.createElement('button');
            button.innerText = text;
            button.classList.add('btn');
            button.onclick = () => alert(`You picked ${text}!`);
            answerButtonsElement.appendChild(button);
        });
    }

    showQuestion(sampleData);
</script>

</body>
</html>
